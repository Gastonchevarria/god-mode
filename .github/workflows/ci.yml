name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml ruff==0.16.9
      - name: Validate skills, agents, packs and credits
        run: python3 scripts/validate.py
      - name: Generated files are up to date
        run: python3 scripts/build_plugins.py --check
      - name: Validate plugin manifests with the Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Lint Python
        run: ruff check scripts tests bin/god-mode
      - name: Lint shell
        run: shellcheck install.sh tests/smoke.sh

  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: End-to-end install tests
        run: bash tests/smoke.sh

  archify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/god-mode-core/skills/archify/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install archify dev dependencies
        run: npm ci --prefix plugins/god-mode-core/skills/archify
      - name: Archify skill tests
        run: python3 scripts/test_archify.py

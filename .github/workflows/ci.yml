name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml ruff
      - name: Validate skills, agents, packs and credits
        run: python3 scripts/validate.py --max-description 1024
      - name: Lint Python
        run: ruff check scripts tests bin/god-mode
      - name: Lint shell
        run: shellcheck install.sh tests/smoke.sh

  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: End-to-end install tests
        run: bash tests/smoke.sh

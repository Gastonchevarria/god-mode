<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00D2FE" stop-opacity="0.19683281572999747"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glow-indigo" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.21316718427000253"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brand-grad" x1="45%" y1="0%" x2="145%" y2="0%">
      <stop offset="0%" stop-color="#00D2FE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FE" stop-opacity="0.5756230589874906"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.42437694101250945"/>
    </linearGradient>

    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c"/>
      <stop offset="100%" stop-color="#08101d"/>
    </linearGradient>

    <pattern id="micro-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="630" fill="#07080c"/>
  <rect width="1200" height="630" fill="url(#micro-grid)"/>

  <!-- Radial Glow Spheres -->
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>
  <rect width="1200" height="630" fill="url(#glow-indigo)"/>
  <rect width="1200" height="630" fill="url(#glow-purple)"/>

  <!-- Outer Glassmorphic Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="#0d111a" fill-opacity="0.75" stroke="url(#card-border)" stroke-width="1.8"/>

  <!-- Window Controls & Header Bar -->
  <g transform="translate(60, 62)">
    <circle cx="0" cy="0" r="6" fill="#FF5F56"/>
    <circle cx="18" cy="0" r="6" fill="#FFBD2E"/>
    <circle cx="36" cy="0" r="6" fill="#27C93F"/>
    <text x="60" y="4" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">dev-god-mode / fable-5.1-protocol</text>
    
    <!-- Live Status Chip with Blinking Dot -->
    <g transform="translate(900, -8)">
      <rect x="0" y="0" width="140" height="24" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.261832212156129" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.2061073738537633" fill="#10B981" fill-opacity="0.6030536869268817"/>
      <text x="26" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.5">MULTI-ENGINE SYNC</text>
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="30" y1="95" x2="1170" y2="95" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top Category Chip -->
  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="220" height="28" rx="8" fill="#00D2FE" fill-opacity="0.1" stroke="#00D2FE" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">⚡ AUTONOMOUS AI SQUAD</text>
  </g>

  <!-- Title: DEV GOD-MODE -->
  <text x="60" y="215" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="56" font-weight="900" fill="url(#brand-grad)" letter-spacing="-1.5">
    DEV GOD-MODE
  </text>

  <!-- Subtitle -->
  <text x="60" y="252" font-family="'Inter', sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
    The Elite Developer Agent Protocol for Claude Code, Antigravity &amp; Cursor
  </text>

  <!-- Laser Connecting Pipeline Line -->
  <path d="M 60 380 L 1140 380" stroke="#00D2FE" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M 466.0 380 L 626.0 380" stroke="#00D2FE" stroke-width="3" filter="url(#laser-glow)"/>
  <circle cx="546.0" cy="380" r="5" fill="#ffffff" filter="url(#laser-glow)"/>

  <!-- 4 Feature Nodes -->
  <!-- Node 1: GOD Router -->
  <g transform="translate(60, 315)">
    <rect x="0" y="0" width="245" height="130" rx="16" fill="url(#node-cyan)" stroke="#00D2FE" stroke-opacity="0.2" stroke-width="1.3599999999999999"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#00D2FE" fill-opacity="0.14"/>
    <text x="24" y="36" font-family="sans-serif" font-size="16" fill="#38bdf8">🧭</text>
    <text x="58" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ffffff">GOD ROUTER</text>
    <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">Intent Classifier</text>
    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">
      <tspan x="14" dy="0">Instant mental diagnosis of</tspan>
      <tspan x="14" dy="16">the problem phase &amp; tools.</tspan>
    </text>
  </g>

  <!-- Node 2: Fable 5.1 Doctrine -->
  <g transform="translate(330, 315)">
    <rect x="0" y="0" width="245" height="130" rx="16" fill="url(#node-cyan)" stroke="#6366F1" stroke-opacity="0.43999999999999995" stroke-width="1.552"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#6366F1" fill-opacity="0.188"/>
    <text x="24" y="36" font-family="sans-serif" font-size="16" fill="#818cf8">⚡</text>
    <text x="58" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ffffff">FABLE 5.1</text>
    <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#818cf8">Never Stop Short</text>
    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">
      <tspan x="14" dy="0">Strict end-to-end execution.</tspan>
      <tspan x="14" dy="16">Zero TODOs. Zero excuses.</tspan>
    </text>
  </g>

  <!-- Node 3: Thermos Double Review -->
  <g transform="translate(600, 315)">
    <rect x="0" y="0" width="245" height="130" rx="16" fill="url(#node-cyan)" stroke="#A855F7" stroke-opacity="0.2" stroke-width="1.3599999999999999"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#A855F7" fill-opacity="0.14"/>
    <text x="24" y="36" font-family="sans-serif" font-size="16" fill="#c084fc">🛡️</text>
    <text x="58" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ffffff">THERMOS AUDIT</text>
    <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#c084fc">Dual Subagents</text>
    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">
      <tspan x="14" dy="0">Parallel AST + DevSecOps</tspan>
      <tspan x="14" dy="16">ruthless code sanity gate.</tspan>
    </text>
  </g>

  <!-- Node 4: 130+ Skills Library -->
  <g transform="translate(870, 315)">
    <rect x="0" y="0" width="245" height="130" rx="16" fill="url(#node-cyan)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.3599999999999999"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#10B981" fill-opacity="0.14"/>
    <text x="24" y="36" font-family="sans-serif" font-size="16" fill="#34d399">📦</text>
    <text x="58" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ffffff">130+ SKILLS</text>
    <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34d399">Fullstack to PLG</text>
    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">
      <tspan x="14" dy="0">Fullstack architecture, DevSecOps,</tspan>
      <tspan x="14" dy="16">Growth Loops &amp; Video pipelines.</tspan>
    </text>
  </g>

  <!-- Bottom Command & Ecosystem Bar -->
  <g transform="translate(60, 485)">
    <!-- Terminal Command Capsule -->
    <rect x="0" y="0" width="670" height="52" rx="12" fill="#04060a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#64748b">$</text>
    <text x="40" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00D2FE">curl -fsSL</text>
    <text x="145" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#e2e8f0">https://raw.githubusercontent.com/Gastonchevarria/god-mode/main/install.sh | bash</text>

    <!-- Supported Engine Badges Right -->
    <g transform="translate(710, 8)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="115" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Claude Code</text>
      </g>
      <g transform="translate(125, 0)">
        <rect x="0" y="0" width="115" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="16" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Antigravity</text>
      </g>
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="115" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Cursor Ready</text>
      </g>
    </g>
  </g>
</svg>